<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>System Health - Admin | ZERØBYTE</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0B1220;
            --bg-secondary: #111827;
            --bg-glass: rgba(17, 24, 39, 0.7);
            --bg-glass-hover: rgba(31, 41, 55, 0.8);
            --bg-glass-solid: rgba(17, 24, 39, 0.95);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --border-glass: rgba(255, 255, 255, 0.1);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --primary: #8B5CF6;
            --primary-hover: #7C3AED;
            --primary-soft: rgba(139, 92, 246, 0.15);
            --error: #EF4444;
            --success: #10B981;
            --warning: #F59E0B;
            --info: #3B82F6;
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        [data-theme="light"] {
            --bg-primary: #F8FAFC;
            --bg-glass-solid: rgba(255, 255, 255, 0.95);
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --border-glass: rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            overflow: hidden;
        }
        
        .animated-bg::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 30% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
            animation: rotate 40s linear infinite;
        }
        
        .animated-bg::after {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 70% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
            animation: rotate-reverse 50s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes rotate-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        
        .admin-layout { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 260px;
            background: var(--bg-glass-solid);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-glass);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: all 0.3s;
            z-index: 100;
        }
        
        .sidebar-header { padding: 1.5rem; text-align: center; border-bottom: 1px solid var(--border-subtle); }
        .sidebar-logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--info)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .sidebar-nav { padding: 1rem 0; }
        .sidebar-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: var(--text-secondary); text-decoration: none; transition: all 0.2s; cursor: pointer; }
        .sidebar-item:hover { background: var(--bg-glass); color: var(--text-primary); }
        .sidebar-item.active { background: var(--primary-soft); color: var(--primary); border-right: 3px solid var(--primary); }
        .sidebar-item i { width: 20px; font-size: 1rem; }
        
        .main-content { flex: 1; margin-left: 260px; padding: 1.5rem; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        
        .page-title { font-size: 1.5rem; font-weight: 700; }
        .admin-info { display: flex; align-items: center; gap: 1rem; }
        .logout-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.25rem; transition: color 0.2s; }
        .logout-btn:hover { color: var(--error); }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .health-card {
            background: var(--bg-glass-solid);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-2xl);
            padding: 1rem;
        }
        
        .health-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .health-name {
            font-weight: 600;
        }
        
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-xl);
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .status-badge.up { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-badge.degraded { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-badge.down { background: rgba(239, 68, 68, 0.2); color: var(--error); }
        
        .health-metrics {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-top: 0.25rem;
        }
        
        .progress-bar {
            height: 6px;
            background: var(--border-glass);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            width: 0%;
        }
        
        .progress-fill.good { background: var(--success); }
        .progress-fill.warning { background: var(--warning); }
        .progress-fill.critical { background: var(--error); }
        
        .refresh-btn {
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background: var(--primary);
            border: none;
            border-radius: var(--radius-xl);
            color: white;
            cursor: pointer;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border-left: 4px solid var(--primary);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; z-index: 200; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-menu-btn { display: block; }
        }
    </style>
</head>
<body>

<div class="animated-bg"></div>

<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo"><i class="fas fa-shield-alt"></i> ZERØBYTE<br><span style="font-size: 0.75rem;">Admin Panel</span></div>
        </div>
        <nav class="sidebar-nav">
            <a class="sidebar-item" data-page="dashboard" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a class="sidebar-item" data-page="users" href="users.html"><i class="fas fa-users"></i> Users</a>
            <a class="sidebar-item" data-page="moderation" href="moderation.html"><i class="fas fa-gavel"></i> Moderation</a>
            <a class="sidebar-item" data-page="reports" href="reports.html"><i class="fas fa-flag"></i> Reports</a>
            <a class="sidebar-item" data-page="broadcasts" href="broadcasts.html"><i class="fas fa-bullhorn"></i> Broadcasts</a>
            <a class="sidebar-item" data-page="verification" href="verification.html"><i class="fas fa-check-circle"></i> Verification</a>
            <a class="sidebar-item" data-page="analytics" href="analytics.html"><i class="fas fa-chart-line"></i> Analytics</a>
            <a class="sidebar-item active" data-page="system-health"><i class="fas fa-heartbeat"></i> System Health</a>
            <a class="sidebar-item" data-page="permissions" href="permissions.html"><i class="fas fa-key"></i> Permissions</a>
        </nav>
    </aside>
    
    <main class="main-content">
        <div class="top-bar">
            <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
            <h1 class="page-title">System Health</h1>
            <div class="admin-info">
                <span id="adminName">Admin</span>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        
        <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh Status</button>
        
        <div class="stats-grid" id="healthGrid">
            <!-- Will be populated dynamically -->
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
    const SUPABASE_URL = 'https://tzfnmcbegbuwuzkqdphy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6Zm5tY2JlZ2J1d3V6a3FkcGh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDM3NTEsImV4cCI6MjA5NTI3OTc1MX0.RQJIfVX_HB-4mtcqmZHrowyFXyGJTxoL6wNj6Y5R6Hk';
    
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUserId = null;
    
    function showToast(message, type = 'info') {
        const existingToast = document.querySelector('.toast');
        if (existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = 'toast';
        const icon = type === 'error' ? 'fa-exclamation-circle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle';
        toast.innerHTML = `<i class="fas ${icon}" style="margin-right: 0.5rem;"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) { window.location.href = 'index.html'; return false; }
        currentUserId = session.user.id;
        const { data: user } = await _supabase.from('users').select('*').eq('id', currentUserId).single();
        if (!user || (user.role !== 'admin' && user.role !== 'superadmin')) {
            showToast('Access denied.', 'error');
            setTimeout(() => window.location.href = 'index.html', 1500);
            return false;
        }
        document.getElementById('adminName').textContent = user.display_name || user.username || 'Admin';
        return true;
    }
    
    async function checkDatabaseHealth() {
        const start = Date.now();
        try {
            await _supabase.from('users').select('id', { count: 'exact', head: true }).limit(1);
            const latency = Date.now() - start;
            return { status: 'up', latency: latency, message: 'Connected' };
        } catch (error) {
            return { status: 'down', latency: 0, message: error.message };
        }
    }
    
    async function checkStorageHealth() {
        try {
            const { data, error } = await _supabase.storage.listBuckets();
            if (error) throw error;
            return { status: 'up', message: `${data?.length || 0} buckets available` };
        } catch (error) {
            return { status: 'down', message: error.message };
        }
    }
    
    async function checkAuthHealth() {
        try {
            const { data, error } = await _supabase.auth.getSession();
            if (error) throw error;
            return { status: 'up', message: 'Auth service operational' };
        } catch (error) {
            return { status: 'down', message: error.message };
        }
    }
    
    async function checkRealtimeHealth() {
        try {
            const channel = _supabase.channel('health-check');
            const result = await new Promise((resolve) => {
                const timeout = setTimeout(() => resolve({ status: 'degraded', message: 'Timeout' }), 5000);
                channel.subscribe((status) => {
                    clearTimeout(timeout);
                    if (status === 'SUBSCRIBED') {
                        channel.unsubscribe();
                        resolve({ status: 'up', message: 'Connected' });
                    } else if (status === 'CHANNEL_ERROR') {
                        resolve({ status: 'down', message: 'Connection failed' });
                    }
                });
            });
            return result;
        } catch (error) {
            return { status: 'down', message: error.message };
        }
    }
    
    async function getSystemStats() {
        const { count: totalUsers } = await _supabase.from('users').select('*', { count: 'exact', head: true });
        const { count: activeToday } = await _supabase.from('users').select('*', { count: 'exact', head: true })
            .gte('last_active_at', new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString());
        
        const weekAgo = new Date();
        weekAgo.setDate(weekAgo.getDate() - 7);
        const { count: newUsers } = await _supabase.from('users').select('*', { count: 'exact', head: true })
            .gte('created_at', weekAgo.toISOString());
        
        return {
            totalUsers: totalUsers || 0,
            activeToday: activeToday || 0,
            newUsersWeek: newUsers || 0
        };
    }
    
    function getUsagePercentage(value, max) {
        return Math.min((value / max) * 100, 100);
    }
    
    async function loadHealthStatus() {
        const grid = document.getElementById('healthGrid');
        grid.innerHTML = '<div style="text-align: center; padding: 2rem;"><i class="fas fa-spinner fa-spin"></i> Loading system status...</div>';
        
        const [dbHealth, storageHealth, authHealth, realtimeHealth, stats] = await Promise.all([
            checkDatabaseHealth(),
            checkStorageHealth(),
            checkAuthHealth(),
            checkRealtimeHealth(),
            getSystemStats()
        ]);
        
        const storageUsage = getUsagePercentage(stats.totalUsers, 10000);
        
        grid.innerHTML = `
            <div class="health-card">
                <div class="health-status">
                    <span class="health-name"><i class="fas fa-database"></i> Database</span>
                    <span class="status-badge ${dbHealth.status}">${dbHealth.status.toUpperCase()}</span>
                </div>
                <div class="health-metrics">
                    <div class="metric-row"><span>Latency:</span><span>${dbHealth.latency}ms</span></div>
                    <div class="metric-row"><span>Status:</span><span>${dbHealth.message}</span></div>
                </div>
            </div>
            <div class="health-card">
                <div class="health-status">
                    <span class="health-name"><i class="fas fa-cloud-upload-alt"></i> Storage</span>
                    <span class="status-badge ${storageHealth.status}">${storageHealth.status.toUpperCase()}</span>
                </div>
                <div class="health-metrics">
                    <div class="metric-row"><span>Buckets:</span><span>${storageHealth.message}</span></div>
                    <div class="progress-bar"><div class="progress-fill ${storageUsage > 80 ? 'warning' : 'good'}" style="width: ${storageUsage}%;"></div></div>
                    <div class="metric-row"><span>Usage:</span><span>${Math.round(storageUsage)}%</span></div>
                </div>
            </div>
            <div class="health-card">
                <div class="health-status">
                    <span class="health-name"><i class="fas fa-lock"></i> Authentication</span>
                    <span class="status-badge ${authHealth.status}">${authHealth.status.toUpperCase()}</span>
                </div>
                <div class="health-metrics">
                    <div class="metric-row"><span>Status:</span><span>${authHealth.message}</span></div>
                    <div class="metric-row"><span>Total Users:</span><span>${stats.totalUsers.toLocaleString()}</span></div>
                </div>
            </div>
            <div class="health-card">
                <div class="health-status">
                    <span class="health-name"><i class="fas fa-bolt"></i> Realtime</span>
                    <span class="status-badge ${realtimeHealth.status}">${realtimeHealth.status.toUpperCase()}</span>
                </div>
                <div class="health-metrics">
                    <div class="metric-row"><span>Status:</span><span>${realtimeHealth.message}</span></div>
                    <div class="metric-row"><span>Active Today:</span><span>${stats.activeToday.toLocaleString()}</span></div>
                </div>
            </div>
            <div class="health-card">
                <div class="health-status">
                    <span class="health-name"><i class="fas fa-chart-line"></i> System Summary</span>
                    <span class="status-badge up">OPERATIONAL</span>
                </div>
                <div class="health-metrics">
                    <div class="metric-row"><span>Total Users:</span><span>${stats.totalUsers.toLocaleString()}</span></div>
                    <div class="metric-row"><span>New Users (7d):</span><span>${stats.newUsersWeek}</span></div>
                    <div class="metric-row"><span>Active Today:</span><span>${stats.activeToday.toLocaleString()}</span></div>
                </div>
            </div>
        `;
    }
    
    document.getElementById('refreshBtn')?.addEventListener('click', loadHealthStatus);
    
    document.querySelectorAll('.sidebar-item').forEach(item => {
        item.addEventListener('click', (e) => {
            const page = item.dataset.page;
            if (page && page !== 'system-health') {
                window.location.href = `${page}.html`;
            }
        });
    });
    
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    mobileMenuBtn?.addEventListener('click', () => sidebar.classList.toggle('open'));
    
    document.getElementById('logoutBtn')?.addEventListener('click', async () => {
        await _supabase.auth.signOut();
        window.location.href = 'index.html';
    });
    
    async function init() {
        if (!await checkAuth()) return;
        await loadHealthStatus();
        setInterval(loadHealthStatus, 60000); // Refresh every minute
    }
    init();
})();
</script>
</body>
</html>
